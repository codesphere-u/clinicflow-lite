[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "clinicflow-lite"
version = "0.1.0"
description = "Offline-first rural clinic WHO IMCI deterministic pediatric triage engine, WHO PQS vaccine cold-chain excursion & Arrhenius VVM analyzer, and FHIR R4 SQLite sync node."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Akandwanaho Ivan Alvin", email = "codesphereinnovationz@gmail.com" },
]
keywords = [
    "healthcare",
    "healthtech",
    "fhir",
    "imci",
    "who",
    "cold-chain",
    "vaccines",
    "offline-first",
    "digital-health",
    "africa",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.8.0",
    "mypy>=1.11.0",
]

[project.scripts]
clinicflow-lite = "clinicflow_lite.cli:main"

[project.urls]
Homepage = "https://github.com/codesphere-u/clinicflow-lite"
Repository = "https://github.com/codesphere-u/clinicflow-lite"
Issues = "https://github.com/codesphere-u/clinicflow-lite/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/clinicflow_lite"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["clinicflow_lite"]
